name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore RMN weights
        uses: actions/cache@v4
        with:
          path: public/rmn/resmasking_int8.onnx
          key: rmn-int8-v1
      - run: npm ci
      - run: npm run test:accuracy
      - run: npm run lint
      - run: npm run build
