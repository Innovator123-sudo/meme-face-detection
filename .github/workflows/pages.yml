name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Static Pages has no Express backend: skip the 139 MB RMN download.
      # The committed 5 MB Kuldeep ONNX + FER + geometry voters carry the reads.
      - run: npm ci
        env:
          SKIP_RMN: '1'
      - run: npm run test:accuracy
      - run: npm run verify:kuldeep
      - run: node scripts/test-online-client.mjs
      - run: node scripts/test-beast-fusion.mjs
      - run: npm run video-catalog
      - run: npm run lint
      - run: npm run build
        env:
          GITHUB_PAGES: '1'
          SKIP_RMN: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
